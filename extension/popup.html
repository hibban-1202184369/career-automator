<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Career Automator Sync</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 280px; padding: 16px; background: #0b1021; color: #f1f5f9; margin: 0; }
    h2 { font-size: 16px; margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    input { width: 100%; box-sizing: border-box; padding: 8px 12px; background: #070913; border: 1px solid #1e264a; color: #fff; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { opacity: 0.9; }
    #status { margin-top: 12px; font-size: 12px; padding: 8px; border-radius: 6px; text-align: center; display: none; }
    .success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <h2>⚡ Auto-Sync Cookies</h2>
  <p>Masukkan URL Web App Career Automator Anda (Vercel atau localhost):</p>
  <input type="text" id="targetUrl" value="https://career-automator-xi.vercel.app" />
  <button id="syncBtn">🚀 Sync All Platform Cookies</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
